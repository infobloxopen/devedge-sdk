syntax = "proto3";

// Test-only fixture for secret / write-only field tests: messages with
// (infoblox.field.v1.opts).secret and (google.api.field_behavior) = INPUT_ONLY
// annotations, shared between middleware/redact and seccheck test packages.
package secretpb;

import "google/api/field_behavior.proto";
import "infoblox/field/v1/field.proto";

option go_package = "github.com/infobloxopen/devedge-sdk/internal/testpb/secretpb;secretpb";

// SecretMsg has a secret field, an explicitly write-only (INPUT_ONLY) field, and
// a public field.
message SecretMsg {
  string id = 1;
  string key_value = 2 [(infoblox.field.v1.opts) = {secret: true}];
  string public_value = 3;
  // write_only is INPUT_ONLY via an explicit field_behavior (not secret): it is
  // still stripped from responses/logs by redact, proving INPUT_ONLY ⊇ secret.
  string write_only = 4 [(google.api.field_behavior) = INPUT_ONLY];
}

// NestedMsg wraps SecretMsg so we can test recursive redaction.
message NestedMsg {
  string outer = 1;
  SecretMsg inner = 2;
}

// PlainMsg has no secret fields at all.
message PlainMsg {
  string name = 1;
  string value = 2;
}
