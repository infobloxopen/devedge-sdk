syntax = "proto3";

// Test fixture for protoc-gen-storage secret field support (W9-10/013).
// Exercises the (infoblox.field.v1.opts).secret annotation.
package apikey.v1;

option go_package = "github.com/infobloxopen/devedge-sdk/testdata/apikey/apikeyv1;apikeyv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "infoblox/authz/v1/authz.proto";
import "infoblox/field/v1/field.proto";
import "infoblox/storage/v1/storage.proto";

// APIKey is a customer API key. The raw key_value is never stored as plaintext;
// the framework stores a hash (for lookup) and optional ciphertext (for recovery).
message APIKey {
  option (google.api.resource) = {
    type: "apikey.example.com/APIKey"
    pattern: "apikeys/{api_key}"
  };

  // name is the AIP-122 resource name, e.g. "apikeys/abc123".
  string name       = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string id         = 2;
  string account_id = 3;
  // key_value is the raw API key material. Annotated secret: the storage layer
  // will hash and encrypt this field; it is cleared in all responses after creation.
  string key_value  = 4 [(infoblox.field.v1.opts) = {secret: true}];
  string key_prefix = 5;
  string label      = 6;
  // AIP-148: soft-delete timestamp; set by Delete, cleared by Undelete.
  google.protobuf.Timestamp delete_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // AIP-148: TTL; if set, the key may be purged by PurgeExpired after this time.
  google.protobuf.Timestamp expire_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // AIP-154 ETag: framework-managed. The storage layer stamps a fresh token on
  // every create/update and surfaces it here on read, so a client can echo it as
  // If-Match for a conditional update (412 on mismatch).
  string etag = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // tags is a free-form map of string labels. The Tags field kind: a
  // map<string, string> is detected by the storage generators and persisted as a
  // single JSONB column (via types.Tags on the GORM model, a JSON field on the
  // ent schema) — no annotation needed.
  map<string, string> tags = 10;
}

// APIKeySummary is a read-oriented PROJECTION (surface) over the APIKey storage
// model (F027 Phase 5b multi-surface). (infoblox.storage.v1.model)="APIKey" binds
// it to APIKey's table, so it shares ONE table: the generators emit a repository
// adapter + projection over the APIKey model and NO table of its own. It exposes a
// non-secret subset — never the key_value secret. account_id is required because
// APIKey is tenant-scoped (the adapter scopes/stamps the tenant).
message APIKeySummary {
  option (infoblox.storage.v1.model) = "APIKey";

  string id         = 1;
  string account_id = 2;
  string key_prefix = 3;
  string label      = 4;
}

service APIKeyService {
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (APIKey) {
    option (google.api.http) = {post: "/v1/apikeys", body: "api_key"};
    option (infoblox.authz.v1.rule) = {verb: "create", resource: "api_keys"};
  }
  rpc GetAPIKey(GetAPIKeyRequest) returns (APIKey) {
    option (google.api.http) = {get: "/v1/apikeys/{id}"};
    option (infoblox.authz.v1.rule) = {verb: "read", resource: "api_keys"};
  }
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse) {
    option (google.api.http) = {get: "/v1/apikeys"};
    option (infoblox.authz.v1.rule) = {verb: "read", resource: "api_keys"};
  }
  rpc DeleteAPIKey(DeleteAPIKeyRequest) returns (DeleteAPIKeyResponse) {
    option (google.api.http) = {delete: "/v1/apikeys/{id}"};
    option (infoblox.authz.v1.rule) = {verb: "delete", resource: "api_keys"};
  }
}

message CreateAPIKeyRequest  { APIKey api_key = 1; }
message GetAPIKeyRequest     {
  string id = 1;
  // AIP-157: fields to return; empty means all fields.
  google.protobuf.FieldMask read_mask = 3;
}
message ListAPIKeysRequest   {
  int32  page_size    = 1;
  string page_token   = 2;
  bool   show_deleted = 3;
  // AIP-157: fields to return; empty means all fields.
  google.protobuf.FieldMask read_mask = 4;
}
message ListAPIKeysResponse  { repeated APIKey api_keys = 1; string next_page_token = 2; }
message DeleteAPIKeyRequest  { string id = 1; }
message DeleteAPIKeyResponse {}
