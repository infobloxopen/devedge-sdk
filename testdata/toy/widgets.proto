syntax = "proto3";

// Test fixture for protoc-gen-svc + protoc-gen-storage (W3-4 checkpoint).
// This proto exercises both plugins: a resource message (Widget) and a service
// (WidgetService) with authz annotations on all five standard AIP methods.
package toy.v1;

option go_package = "github.com/infobloxopen/devedge-sdk/testdata/toy/widgetsv1;widgetsv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "infoblox/authz/v1/authz.proto";
import "infoblox/field/v1/field.proto";
import "infoblox/storage/v1/storage.proto";

// Widget is the resource managed by WidgetService.
message Widget {
  option (google.api.resource) = {
    type: "toy.example.com/Widget"
    pattern: "widgets/{widget}"
  };

  // WS-041 full-text search: display_name is a field-flagged searchable source
  // (below), and category_label is a message-level calculated source carrying a
  // Postgres CASE expr (the DDI `map_zone_type` shape, used on Postgres) plus a
  // portable `cel` alternate (used for the SQLite `LIKE` fallback), so the
  // resource stays SQLite-portable while exercising the sql/postgres flavor.
  option (infoblox.storage.v1.search) = {
    strategy: STRATEGY_JIT
    text_config: "simple"
    sources {
      name: "category_label"
      exprs {
        expr {
          flavor: "sql"
          dialect: "postgres"
          version: "1"
          expr: "CASE category WHEN 'premium' THEN 'tier premium deluxe' WHEN 'standard' THEN 'tier standard basic' ELSE 'tier none' END"
        }
        expr {
          flavor: "cel"
          version: "1"
          expr: "msg.category == 'premium' ? 'tier premium' : 'tier standard'"
        }
      }
    }
  };

  // name is the AIP-122 resource name, e.g. "widgets/abc123".
  string name         = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // id is USER_SETTABLE (AIP-133): the annotation alone derives IMMUTABLE for the
  // API contract (FR-A6 "annotate once") — no explicit field_behavior needed.
  string id           = 2 [(infoblox.field.v1.opts) = {id: {strategy: STRATEGY_USER_SETTABLE}}];
  // display_name is client-REQUIRED (explicit field_behavior) and field-flagged
  // searchable (WS-041): included in the resource's full-text search vector.
  string display_name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (infoblox.field.v1.opts) = {searchable: true}
  ];
  // color is IMMUTABLE (explicit field_behavior): set at create, never updated.
  string color        = 4 [(google.api.field_behavior) = IMMUTABLE];
  int32  weight       = 5;
  string etag         = 6;
  // sku is storage NOT NULL but NOT client-required — proving not_null is never
  // mapped to REQUIRED (FM-4/AC-1).
  string sku          = 9 [(infoblox.field.v1.opts) = {not_null: true}];
  // category is a string-backed enum (allowed_values → OpenAPI enum, AC-4).
  string category     = 10 [(infoblox.field.v1.opts) = {allowed_values: ["standard", "premium"]}];
  // secret_token is write-only material (secret → INPUT_ONLY): accepted on write,
  // stripped from responses by middleware/redact (AC-3), writeOnly in OpenAPI.
  string secret_token = 11 [(infoblox.field.v1.opts) = {secret: true}];
  // parent_id is a cross-service reference to another Widget (AIP-124). Widget is
  // batch-fetchable (WidgetService serves BatchGetWidgets), so the reference
  // resolves; surfaces as x-aip-references in the enriched OpenAPI (AC-5).
  string parent_id    = 12 [(google.api.resource_reference) = {type: "toy.example.com/Widget"}];
  // AIP-148: soft-delete timestamp; set by Delete, cleared by Undelete.
  google.protobuf.Timestamp delete_time   = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // AIP-136: set by ArchiveWidget; non-nil means the widget is archived.
  google.protobuf.Timestamp archived_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Gizmo is the WS-041 INDEXED-strategy fixture (FR-C1/C2/C3): a searchable
// resource whose search vector is materialized as a persisted `search_vector`
// generated column + GIN index (emitted as a Postgres migration under migrations/)
// rather than recomputed per query. `label` is a field-flagged searchable source;
// `tier_label` is a message-level sql/postgres CASE source (the DDI map_zone_type
// shape) with a portable `cel` alternate, so the persisted column exercises the
// sql/postgres flavor (AC-8) while the resource stays SQLite-portable (the query-time
// LIKE fallback stands on SQLite; INDEXED is a Postgres-only materialization, FR-C3).
// It has no RPC surface — it is exercised directly through the generated repository.
message Gizmo {
  option (google.api.resource) = {
    type: "toy.example.com/Gizmo"
    pattern: "gizmos/{gizmo}"
  };
  option (infoblox.storage.v1.search) = {
    strategy: STRATEGY_INDEXED
    text_config: "simple"
    sources {
      name: "tier_label"
      exprs {
        expr {
          flavor: "sql"
          dialect: "postgres"
          version: "1"
          expr: "CASE category WHEN 'premium' THEN 'tier premium deluxe' WHEN 'standard' THEN 'tier standard basic' ELSE 'tier none' END"
        }
        expr {
          flavor: "cel"
          version: "1"
          expr: "msg.category == 'premium' ? 'tier premium' : 'tier standard'"
        }
      }
    }
  };

  string name     = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string id       = 2 [(infoblox.field.v1.opts) = {id: {strategy: STRATEGY_USER_SETTABLE}}];
  // label is field-flagged searchable (WS-041): included in the persisted vector.
  string label    = 3 [(infoblox.field.v1.opts) = {searchable: true}];
  // category is a string-backed enum feeding the tier_label CASE source.
  string category = 4 [(infoblox.field.v1.opts) = {allowed_values: ["standard", "premium"]}];
}

message CreateWidgetRequest {
  Widget widget        = 1;
  string request_id    = 2; // AIP-155: idempotency key; empty = no dedup.
  bool   validate_only = 3; // AIP-163: dry-run; validate but do not persist.
}
message GetWidgetRequest    {
  string id = 1;
  // AIP-157: fields to return; empty means all fields.
  google.protobuf.FieldMask read_mask = 8;
}
message ListWidgetsRequest  {
  int32  page_size   = 1;
  string page_token  = 2;
  // AIP-148: include soft-deleted widgets when true.
  bool   show_deleted = 3;
  // AIP-157: fields to return; empty means all fields.
  google.protobuf.FieldMask read_mask = 4;
  // WS-041 full-text search (`q` collection operator): free-text query across the
  // resource's searchable fields; mapped onto persistence.ListOptions.Search.
  string q = 5;
}
message ListWidgetsResponse {
  repeated Widget widgets         = 1;
  string          next_page_token = 2;
}
message UpdateWidgetRequest {
  Widget          widget      = 1;
  repeated string update_mask = 2;
}
message DeleteWidgetRequest  { string id = 1; }
message DeleteWidgetResponse {}

// AIP-136: custom method — archive a widget.
message ArchiveWidgetRequest  { string id = 1; }
message ArchiveWidgetResponse { Widget widget = 1; }

// AIP-137: batch get.
message BatchGetWidgetsRequest  { repeated string ids = 1; }
message BatchGetWidgetsResponse { repeated Widget widgets = 1; }

// AIP-137: batch delete.
message BatchDeleteWidgetsRequest { repeated string ids = 1; }

// AIP-137: batch update — each request carries its own widget + update_mask.
message BatchUpdateWidgetsRequest  { repeated UpdateWidgetRequest requests = 1; }
message BatchUpdateWidgetsResponse { repeated Widget widgets = 1; }

// AIP-151: long-running operation status for widget processing.
message ProcessWidgetRequest     { string id = 1; }
message OperationStatus          {
  string name   = 1;
  bool   done   = 2;
  string result = 3;
}
message GetOperationStatusRequest    { string name = 1; }
// AIP-152: cancel a running long-running operation.
message CancelWidgetOperationRequest { string name = 1; }

service WidgetService {
  rpc CreateWidget(CreateWidgetRequest) returns (Widget) {
    option (google.api.http) = {post: "/v1/widgets", body: "widget"};
    option (infoblox.authz.v1.rule) = {verb: "create", resource: "widgets"};
  }
  rpc GetWidget(GetWidgetRequest) returns (Widget) {
    option (google.api.http) = {get: "/v1/widgets/{id}"};
    option (infoblox.authz.v1.rule) = {verb: "read", resource: "widgets"};
  }
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsResponse) {
    option (google.api.http) = {get: "/v1/widgets"};
    option (infoblox.authz.v1.rule) = {verb: "read", resource: "widgets"};
  }
  rpc UpdateWidget(UpdateWidgetRequest) returns (Widget) {
    option (google.api.http) = {patch: "/v1/widgets/{widget.id}", body: "widget"};
    option (infoblox.authz.v1.rule) = {verb: "update", resource: "widgets"};
  }
  rpc DeleteWidget(DeleteWidgetRequest) returns (DeleteWidgetResponse) {
    option (google.api.http) = {delete: "/v1/widgets/{id}"};
    option (infoblox.authz.v1.rule) = {verb: "delete", resource: "widgets"};
  }
  // AIP-136: custom method — sets archived_time on the widget.
  rpc ArchiveWidget(ArchiveWidgetRequest) returns (ArchiveWidgetResponse) {
    option (google.api.http) = {post: "/v1/widgets/{id}:archive", body: "*"};
    option (infoblox.authz.v1.rule) = {verb: "archive", resource: "widgets"};
  }
  // AIP-137: retrieve multiple widgets in one call.
  rpc BatchGetWidgets(BatchGetWidgetsRequest) returns (BatchGetWidgetsResponse) {
    option (google.api.http) = {get: "/v1/widgets:batchGet"};
    option (infoblox.authz.v1.rule) = {verb: "read", resource: "widgets"};
  }
  // AIP-137: soft-delete multiple widgets atomically.
  rpc BatchDeleteWidgets(BatchDeleteWidgetsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/v1/widgets:batchDelete", body: "*"};
    option (infoblox.authz.v1.rule) = {verb: "delete", resource: "widgets"};
  }
  // AIP-137: update multiple widgets atomically (each request carries its own update_mask).
  rpc BatchUpdateWidgets(BatchUpdateWidgetsRequest) returns (BatchUpdateWidgetsResponse) {
    option (google.api.http) = {post: "/v1/widgets:batchUpdate", body: "*"};
    option (infoblox.authz.v1.rule) = {verb: "update", resource: "widgets"};
  }
  // AIP-151: start async processing; returns a pending OperationStatus immediately.
  rpc ProcessWidget(ProcessWidgetRequest) returns (OperationStatus) {
    option (google.api.http) = {post: "/v1/widgets/{id}:process", body: "*"};
    option (infoblox.authz.v1.rule) = {verb: "write", resource: "widgets"};
  }
  // AIP-151: poll the status of a previously submitted ProcessWidget operation.
  rpc GetOperationStatus(GetOperationStatusRequest) returns (OperationStatus) {
    option (google.api.http) = {get: "/v1/operations/{name=**}"};
    option (infoblox.authz.v1.rule) = {verb: "read", resource: "widgets"};
  }
  // AIP-152: cancel a running ProcessWidget operation.
  rpc CancelWidgetOperation(CancelWidgetOperationRequest) returns (OperationStatus) {
    option (google.api.http) = {post: "/v1/operations/{name=**}:cancel", body: "*"};
    option (infoblox.authz.v1.rule) = {verb: "write", resource: "widgets"};
  }
}
