syntax = "proto3";

// Two-resource ent relationship fixture (parent/child).
//
// A Fleet has_many Vehicles; each Vehicle belongs_to a Fleet via a scalar
// fleet_id foreign key — the documented "natural AIP shape" for a 1:N
// relationship. This exercises the protoc-gen-ent has_many/belongs_to edge
// codegen (singular related type, a proper edge.From(...).Ref(...) inverse,
// and the scalar-FK/edge de-duplication via .Field(...)) that the
// single-resource, edge-less apikey fixture never touches.
package fleet.v1;

option go_package = "github.com/infobloxopen/devedge-sdk/testdata/fleet/fleetv1;fleetv1";

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "infoblox/field/v1/field.proto";
import "infoblox/ddd/v1/ddd.proto";

// Fleet is the parent resource: a tenant-scoped collection of Vehicles with a
// per-tenant unique display_name.
//
// F031: Fleet is an aggregate ROOT and Vehicle is its owned MEMBER (containment).
// The Fleet→Vehicle FK therefore generates OnDelete: Cascade (deleting a Fleet
// deletes its Vehicles), and an etag field + EtagMixin make the Fleet etag the
// aggregate version that an AggregateRepository.Save bumps on any member change.
message Fleet {
  option (infoblox.ddd.v1.aggregate) = {root: true};

  string id           = 1;
  string account_id   = 2;
  string display_name = 3 [(infoblox.field.v1.opts) = {unique: true}];
  // has_many: the child Vehicles, keyed by the fleet_id FK on the Vehicle side.
  repeated Vehicle vehicles = 4 [(infoblox.field.v1.opts) = {has_many: {foreign_key: "fleet_id"}}];
  // Soft-delete opt-in (AIP-148). Combined with the per-tenant unique
  // display_name above, this is the soft-delete + unique shape from the #49
  // follow-up: display_name must be re-creatable once a Fleet is soft-deleted
  // (partial unique index on PostgreSQL/SQLite; a soft_delete_key discriminator
  // on MySQL).
  google.protobuf.Timestamp delete_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // AIP-154 etag = the aggregate version (F031 etag-as-aggregate-version). Owned
  // by EtagMixin; AggregateRepository.Save bumps it on any member mutation.
  string etag = 6;
}

// Vehicle is the child resource: it belongs_to a Fleet. fleet_id is exposed as
// a first-class scalar field (so clients can read/filter it) AND drives the
// belongs_to association — the combination that previously collided in ent.
//
// F031: Vehicle is a MEMBER of the Fleet aggregate (containment). Its belongs_to
// Fleet FK generates OnDelete: Cascade.
message Vehicle {
  option (infoblox.ddd.v1.member) = {root: "Fleet"};

  string id         = 1;
  string account_id = 2;
  string vin        = 3 [(infoblox.field.v1.opts) = {unique: true}];
  // Scalar FK, queryable per AIP; reused by the belongs_to edge below.
  string fleet_id   = 4;
  // belongs_to: the parent Fleet; the FK (fleet_id) lives on this table.
  Fleet fleet       = 5 [(infoblox.field.v1.opts) = {belongs_to: {foreign_key: "fleet_id"}}];
}
