{{- /*
DSN Secret (devedge indirect-DSN + real-DSN-file convention). The Deployment
references this Secret by key; the real connection string never appears in the
Pod spec or the values overlay. The chart owns this Secret only when the
developer has NOT supplied a pre-provisioned one (dsn.existingSecret) — in prod
you provision the Secret out of band (Vault/ExternalSecrets) and set
dsn.existingSecret so the DSN never lands in git.
*/ -}}
{{- if not .Values.dsn.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devedge-service.dsnSecretName" . }}
  labels:
    {{- include "devedge-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.dsn.secretKey }}: {{ .Values.dsn.value | quote }}
{{- end }}
