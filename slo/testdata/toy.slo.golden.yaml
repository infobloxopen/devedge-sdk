apiVersion: openslo/v1
kind: SLO
metadata:
    name: widget-service-read-availability
    labels:
        devedge.io/method-class: read
        devedge.io/service: widget-service
        devedge.io/sli-type: availability
    annotations:
        devedge.io/error-budget-policy: 'TODO: define the consequence when this budget is spent (e.g. freeze feature releases for widget-service until the budget recovers over a full window).'
        devedge.io/layer: service
        devedge.io/uncalibrated: "true"
spec:
    description: WidgetService read availability objective (un-calibrated default — set from a measured baseline before it pages).
    service: widget-service
    indicatorRef: widget-service-read-availability
    budgetingMethod: Occurrences
    timeWindow:
        - duration: 28d
          isRolling: true
    objectives:
        - displayName: read availability
          target: 0.999
    alertPolicies:
        - widget-service-burn-rate
---
