---
apiVersion: openslo/v1
kind: AlertPolicy
metadata:
    name: widget-service-burn-rate
spec:
    description: Multi-window multi-burn-rate error-budget policy (SRE Workbook ch. 5).
    alertWhenBreaching: true
    conditions:
        - conditionRef: widget-service-burn-rate-fast
        - conditionRef: widget-service-burn-rate-medium
        - conditionRef: widget-service-burn-rate-slow
---
apiVersion: openslo/v1
kind: AlertCondition
metadata:
    name: widget-service-burn-rate-fast
spec:
    description: Burn rate 14.4 over 1h and 5m.
    severity: page
    condition:
        kind: burnrate
        op: gt
        threshold: 14.4
        lookbackWindow: 1h
        shortWindow: 5m
---
apiVersion: openslo/v1
kind: AlertCondition
metadata:
    name: widget-service-burn-rate-medium
spec:
    description: Burn rate 6 over 6h and 30m.
    severity: page
    condition:
        kind: burnrate
        op: gt
        threshold: 6
        lookbackWindow: 6h
        shortWindow: 30m
---
apiVersion: openslo/v1
kind: AlertCondition
metadata:
    name: widget-service-burn-rate-slow
spec:
    description: Burn rate 1 over 3d and 6h.
    severity: ticket
    condition:
        kind: burnrate
        op: gt
        threshold: 1
        lookbackWindow: 3d
        shortWindow: 6h
