apiVersion: openslo/v1
kind: Service
metadata:
    name: widget-service
spec:
    description: Reliability targets for the WidgetService service (derived defaults — calibrate before paging).
---
apiVersion: openslo/v1
kind: SLI
metadata:
    name: widget-service-read-availability
spec:
    description: 'WidgetService read availability: server-fault responses over valid requests (client faults excluded).'
    ratioMetric:
        counter: true
        good:
            type: devedge/otel-rpc
            spec:
                sliType: availability
                signal: rpc.server.call.duration
                transport: grpc
                service: toy.v1.WidgetService
                methods:
                    - BatchGetWidgets
                    - GetWidget
                    - ListWidgets
                methodClass: read
                excludeStatuses:
                    - INVALID_ARGUMENT
                    - NOT_FOUND
                    - ALREADY_EXISTS
                    - PERMISSION_DENIED
                    - UNAUTHENTICATED
                    - UNKNOWN
                    - DEADLINE_EXCEEDED
                    - INTERNAL
                    - UNAVAILABLE
                    - DATA_LOSS
        total:
            type: devedge/otel-rpc
            spec:
                sliType: availability
                signal: rpc.server.call.duration
                transport: grpc
                service: toy.v1.WidgetService
                methods:
                    - BatchGetWidgets
                    - GetWidget
                    - ListWidgets
                methodClass: read
                excludeStatuses:
                    - INVALID_ARGUMENT
                    - NOT_FOUND
                    - ALREADY_EXISTS
                    - PERMISSION_DENIED
                    - UNAUTHENTICATED
---
apiVersion: openslo/v1
kind: SLI
metadata:
    name: widget-service-read-latency
spec:
    description: 'WidgetService read latency: fraction of valid requests completing within 0.25s.'
    ratioMetric:
        counter: true
        good:
            type: devedge/otel-rpc
            spec:
                sliType: latency
                signal: rpc.server.call.duration
                transport: grpc
                service: toy.v1.WidgetService
                methods:
                    - BatchGetWidgets
                    - GetWidget
                    - ListWidgets
                methodClass: read
                excludeStatuses:
                    - INVALID_ARGUMENT
                    - NOT_FOUND
                    - ALREADY_EXISTS
                    - PERMISSION_DENIED
                    - UNAUTHENTICATED
                latencyThresholdSeconds: 0.25
        total:
            type: devedge/otel-rpc
            spec:
                sliType: latency
                signal: rpc.server.call.duration
                transport: grpc
                service: toy.v1.WidgetService
                methods:
                    - BatchGetWidgets
                    - GetWidget
                    - ListWidgets
                methodClass: read
                excludeStatuses:
                    - INVALID_ARGUMENT
                    - NOT_FOUND
                    - ALREADY_EXISTS
                    - PERMISSION_DENIED
                    - UNAUTHENTICATED
