name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            testdata/toy/go.sum
            testdata/apikey/go.sum
            testdata/fleet/go.sum

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Unit tests
        run: make test

      - name: Integration tests (toy fixture)
        run: cd testdata/toy && go test ./...

      - name: Integration tests (apikey fixture)
        run: cd testdata/apikey && go test ./...

      - name: Integration tests (fleet fixture — ent has_many/belongs_to edge)
        run: cd testdata/fleet && go test ./...

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            testdata/toy/go.sum

      - name: Security gate
        run: make security-check
