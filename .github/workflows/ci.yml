name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/go.sum
            config/koanf/go.sum
            events/kafkabus/go.sum
            federationgql/go.sum
            observability/otel/go.sum
            persistence/entrepo/go.sum
            persistence/gormtx/go.sum
            persistence/migrate/go.sum
            testdata/toy/go.sum
            testdata/apikey/go.sum
            testdata/fleet/go.sum
            testdata/iam/go.sum
            examples/graphql-federation/go.sum

      # build/vet/test loop over every module in the repo (root + config/koanf +
      # events/kafkabus + observability/otel + future adapters) via the committed
      # go.work — the multi-module matrix.
      - name: Build (all modules, go.work)
        run: make build

      - name: Vet (all modules, go.work)
        run: make vet

      - name: Unit tests (all modules, go.work)
        run: make test

      # GOWORK=off per-module build: catches a published module missing a `require`
      # that go.work would otherwise silently satisfy from the working tree (the
      # go.work-masking failure mode in the spec). The root builds with real requires
      # only; a nested adapter resolves its root require to the working tree via a
      # transient, reverted replace (pre-release the published root still contains the
      # adapter subtree — see the Makefile target).
      - name: Build with workspace disabled (GOWORK=off, real requires)
        run: make build-gowork-off

      # The graph-level isolation proof (AC-1/AC-2): a server-only consumer's module
      # graph is free of the OTel SDK + exporters; adding the observability/otel
      # adapter pulls them in. Network-touching (temp consumer + go mod tidy).
      - name: Graph-isolation check (AC-1/AC-2)
        run: make check-graph-isolation

      # The SDK framework migration baseline (persistence/migrate/baseline/
      # 0001_framework_init) is generated from the CANONICAL gormtx framework models by
      # Atlas at build time (never in a runtime graph). This is the native drift gate
      # (F043 T2.2): regenerate from the models and fail if the committed baseline is
      # stale. Needs the ariga.io/atlas CLI + Docker (Atlas spins an ephemeral dev PG).
      - name: Install Atlas (schema-migration CLI)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-latest
          chmod +x "$HOME/.local/bin/atlas"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/atlas" version

      - name: Framework migration-baseline drift gate (F043 T2.2)
        run: make check-migration-baseline

      # testdata/* are standalone consumer modules with their own go.mod + a `replace`
      # to the SDK; they are deliberately NOT workspace members, so GOWORK=off (or the
      # workspace rejects their directory).
      - name: Integration tests (toy fixture)
        run: cd testdata/toy && GOWORK=off go test ./...

      - name: Integration tests (apikey fixture)
        run: cd testdata/apikey && GOWORK=off go test ./...

      # The federation fixture (WS-021 P1 / F041) proves cross-service references +
      # guaranteed BatchGet: asset.v1 references region.v1, and a composition resolves
      # N assets' region refs in exactly ONE BatchGet on both ent and GORM (AC-5), plus
      # metadata emission (AC-1), BatchGet-over-wire with read_mask+authz (AC-2), and no
      # ent edge across the reference (AC-4). sqlite-backed, no Docker.
      - name: Integration tests (federation fixture — cross-service refs + BatchGet, ent+gorm)
        run: cd testdata/federation && GOWORK=off go test -race ./...

      # The federationgql module (WS-021 P3 / F042) is a RELEASED nested module (its
      # own go.mod so the GraphQL library stays out of a server-only consumer's graph
      # — see the graph-isolation check). Its unit tests build the schema + resolve
      # edges + derive read_mask with in-process fakes (AC-1). GOWORK=off so it
      # resolves its published root require, mirroring the other per-module gates.
      - name: Unit tests (federationgql — GraphQL federation gateway seam)
        run: cd federationgql && GOWORK=off go test -race ./...

      # The graphql-federation SAMPLE (examples/graphql-federation) is a standalone
      # consumer module (own go.mod + replace to the working tree, like the testdata
      # fixtures) and is NOT released. Its e2e test starts the region + asset services
      # + the gateway over REAL listeners and asserts the cross-service query returns
      # composed data, the anti-N+1 single-BatchGet guarantee holds across the service
      # boundary (AC-3), read_mask is pushed down (AC-4), and authz is never bypassed
      # (AC-5). sqlite-backed, no Docker. GOWORK=off (it is not a workspace member).
      - name: Integration tests (graphql-federation sample — cross-service GraphQL e2e)
        run: cd examples/graphql-federation && GOWORK=off go test -race ./...

      # The fleet + iam fixtures carry the Phase-2 PostgreSQL validation tests
      # (TestPG_*). They start a postgres:16 container via testcontainers and SKIP
      # cleanly if Docker is unavailable — but ubuntu-latest ships a working Docker
      # daemon, so the PG tests RUN here (proving the aggregate / CAS / cascade /
      # outbox machinery on the real production engine), under -race.
      - name: Integration tests (fleet fixture — ent/gorm aggregate, CAS, cascade on Postgres)
        run: cd testdata/fleet && GOWORK=off go test -race ./...

      # The iam fixture also carries the F033 Phase-2 MySQL validation (TestMySQL_*):
      # the append-only partitioned outbox + drop-partition retention proven on real
      # MySQL 8 via testcontainers (the second engine the F033 directive names). They
      # SKIP cleanly without Docker but RUN on ubuntu-latest.
      - name: Integration tests (iam fixture — outbox/events exactly-once on Postgres + MySQL)
        run: cd testdata/iam && GOWORK=off go test -race ./...

      # The persistence/migrate engine (F043 / WS-022 P1) carries the versioned-SQL
      # migration TestPG_ suite on REAL Postgres (testcontainers): applies the framework
      # baseline + module migrations, safe connection, per-module schema + advisory lock,
      # CONCURRENTLY, dirty-state recovery + persisted down-store. It is a workspace
      # module (go.work), so no GOWORK=off. -race covers the concurrent-replica test.
      - name: Integration tests (persistence/migrate — versioned SQL engine on Postgres)
        run: cd persistence/migrate && go test -race ./...

      # Guard against the PG tests silently SKIPPING in CI (e.g. if Docker stopped
      # being available on the runner). They must RUN, not skip — that is the whole
      # point of Phase 2. Fail the job if any TestPG_ test reports SKIP.
      - name: Assert Postgres tests actually ran (not skipped)
        run: |
          set -euo pipefail
          for mod in fleet iam; do
            echo "== ${mod}: TestPG_ must run, not skip =="
            out="$(cd "testdata/${mod}" && GOWORK=off go test -run '^TestPG_' -v ./... 2>&1)"
            echo "$out"
            if echo "$out" | grep -q -- '--- SKIP: TestPG_'; then
              echo "::error::Postgres validation tests SKIPPED in ${mod} — Docker/testcontainers unavailable on the runner. Phase-2 PG validation did not run."
              exit 1
            fi
            if ! echo "$out" | grep -q -- '--- PASS: TestPG_'; then
              echo "::error::No TestPG_ test PASSED in ${mod} — expected the Postgres validation suite to run."
              exit 1
            fi
          done
          echo "== persistence/migrate: TestPG_ must run, not skip =="
          out="$(cd persistence/migrate && go test -run '^TestPG_' -v ./... 2>&1)"
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP: TestPG_'; then
            echo "::error::Postgres migration-engine tests SKIPPED — Docker/testcontainers unavailable. F043 PG validation did not run."
            exit 1
          fi
          if ! echo "$out" | grep -q -- '--- PASS: TestPG_'; then
            echo "::error::No TestPG_ test PASSED in persistence/migrate — expected the migration-engine suite to run."
            exit 1
          fi

      # Same guard for the F033 MySQL validation (iam only). The drop-partition +
      # exactly-once proof on real MySQL must RUN here, not skip.
      - name: Assert MySQL tests actually ran (not skipped)
        run: |
          set -euo pipefail
          echo "== iam: TestMySQL_ must run, not skip =="
          out="$(cd testdata/iam && GOWORK=off go test -run '^TestMySQL_' -v ./... 2>&1)"
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP: TestMySQL_'; then
            echo "::error::MySQL validation tests SKIPPED in iam — Docker/testcontainers unavailable on the runner. Phase-2 MySQL validation did not run."
            exit 1
          fi
          if ! echo "$out" | grep -q -- '--- PASS: TestMySQL_'; then
            echo "::error::No TestMySQL_ test PASSED in iam — expected the MySQL validation suite to run."
            exit 1
          fi

      # Event-bus Phase 2: the iam fixture carries the Kafka production-path validation
      # (TestKafka_*) — the kafkabus adapter (franz-go) + the PostgreSQL advisory-lock
      # relay leader proven end-to-end on a REAL broker (Redpanda, Kafka-API compatible)
      # via testcontainers: outbox → leader-elected relay → Kafka → consumer-group →
      # handler, with the two-consumer partition split, per-key ordering, exactly-once
      # under redelivery, and single-relay-under-the-lock all asserted. They SKIP cleanly
      # without Docker but RUN on ubuntu-latest.
      - name: Integration tests (iam fixture — Kafka event-bus on Redpanda)
        run: cd testdata/iam && GOWORK=off go test -run '^TestKafka_' ./...

      # Guard against the Kafka tests silently SKIPPING in CI. The Phase-2 Kafka
      # production-path proof must RUN, not skip — fail the job if any TestKafka_ reports
      # SKIP, mirroring the PG/MySQL guards above.
      - name: Assert Kafka (Redpanda) tests actually ran (not skipped)
        run: |
          set -euo pipefail
          echo "== iam: TestKafka_ must run, not skip =="
          out="$(cd testdata/iam && GOWORK=off go test -run '^TestKafka_' -v ./... 2>&1)"
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP: TestKafka_'; then
            echo "::error::Kafka (Redpanda) validation tests SKIPPED in iam — Docker/testcontainers unavailable on the runner. Phase-2 Kafka validation did not run."
            exit 1
          fi
          if ! echo "$out" | grep -q -- '--- PASS: TestKafka_'; then
            echo "::error::No TestKafka_ test PASSED in iam — expected the Kafka validation suite to run."
            exit 1
          fi

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/go.sum
            config/koanf/go.sum
            events/kafkabus/go.sum
            observability/otel/go.sum
            persistence/entrepo/go.sum
            persistence/gormtx/go.sum
            persistence/migrate/go.sum
            testdata/toy/go.sum

      - name: Security gate
        run: make security-check

  scaffold-e2e:
    name: Scaffold E2E (apx + buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/go.sum
            config/koanf/go.sum
            events/kafkabus/go.sum
            observability/otel/go.sum
            persistence/entrepo/go.sum
            persistence/gormtx/go.sum
            persistence/migrate/go.sum

      # The TestScaffold_* gates (F028/F029 end-to-end + the make-driven hardening)
      # shell out to a real toolchain — apx (governs the public API surface), buf
      # (codegen), and the public protoc plugins. Without these on PATH the tests
      # requireTools-SKIP, so until now those gates ran only on maintainer machines.
      # Install them (all public, no secrets) so CI enforces the scaffold contract.
      # apx/buf are pinned to the scaffold preflight floor; the protoc plugins track
      # @latest, matching what the generated `make tools` installs for real users.
      - name: Install apx + buf + protoc plugins
        run: |
          go install github.com/infobloxopen/apx/cmd/apx@v0.12.1
          go install github.com/bufbuild/buf/cmd/buf@v1.40.1
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Network-dependent (buf dep update hits the buf.build registry; go mod tidy /
      # go get hit the module proxy). Runs the scaffold suite explicitly rather than
      # relying on `make test` (which the unit job runs without these tools, so the
      # scaffold tests skip there — kept that way to keep the unit job hermetic).
      - name: Scaffold integration tests
        run: go test ./cmd/devedge-sdk -run TestScaffold -v
