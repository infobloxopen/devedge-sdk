name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            testdata/toy/go.sum
            testdata/apikey/go.sum
            testdata/fleet/go.sum
            testdata/iam/go.sum

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Unit tests
        run: make test

      - name: Integration tests (toy fixture)
        run: cd testdata/toy && go test ./...

      - name: Integration tests (apikey fixture)
        run: cd testdata/apikey && go test ./...

      # The fleet + iam fixtures carry the Phase-2 PostgreSQL validation tests
      # (TestPG_*). They start a postgres:16 container via testcontainers and SKIP
      # cleanly if Docker is unavailable — but ubuntu-latest ships a working Docker
      # daemon, so the PG tests RUN here (proving the aggregate / CAS / cascade /
      # outbox machinery on the real production engine), under -race.
      - name: Integration tests (fleet fixture — ent/gorm aggregate, CAS, cascade on Postgres)
        run: cd testdata/fleet && go test -race ./...

      # The iam fixture also carries the F033 Phase-2 MySQL validation (TestMySQL_*):
      # the append-only partitioned outbox + drop-partition retention proven on real
      # MySQL 8 via testcontainers (the second engine the F033 directive names). They
      # SKIP cleanly without Docker but RUN on ubuntu-latest.
      - name: Integration tests (iam fixture — outbox/events exactly-once on Postgres + MySQL)
        run: cd testdata/iam && go test -race ./...

      # Guard against the PG tests silently SKIPPING in CI (e.g. if Docker stopped
      # being available on the runner). They must RUN, not skip — that is the whole
      # point of Phase 2. Fail the job if any TestPG_ test reports SKIP.
      - name: Assert Postgres tests actually ran (not skipped)
        run: |
          set -euo pipefail
          for mod in fleet iam; do
            echo "== ${mod}: TestPG_ must run, not skip =="
            out="$(cd "testdata/${mod}" && go test -run '^TestPG_' -v ./... 2>&1)"
            echo "$out"
            if echo "$out" | grep -q -- '--- SKIP: TestPG_'; then
              echo "::error::Postgres validation tests SKIPPED in ${mod} — Docker/testcontainers unavailable on the runner. Phase-2 PG validation did not run."
              exit 1
            fi
            if ! echo "$out" | grep -q -- '--- PASS: TestPG_'; then
              echo "::error::No TestPG_ test PASSED in ${mod} — expected the Postgres validation suite to run."
              exit 1
            fi
          done

      # Same guard for the F033 MySQL validation (iam only). The drop-partition +
      # exactly-once proof on real MySQL must RUN here, not skip.
      - name: Assert MySQL tests actually ran (not skipped)
        run: |
          set -euo pipefail
          echo "== iam: TestMySQL_ must run, not skip =="
          out="$(cd testdata/iam && go test -run '^TestMySQL_' -v ./... 2>&1)"
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP: TestMySQL_'; then
            echo "::error::MySQL validation tests SKIPPED in iam — Docker/testcontainers unavailable on the runner. Phase-2 MySQL validation did not run."
            exit 1
          fi
          if ! echo "$out" | grep -q -- '--- PASS: TestMySQL_'; then
            echo "::error::No TestMySQL_ test PASSED in iam — expected the MySQL validation suite to run."
            exit 1
          fi

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            testdata/toy/go.sum

      - name: Security gate
        run: make security-check

  scaffold-e2e:
    name: Scaffold E2E (apx + buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The TestScaffold_* gates (F028/F029 end-to-end + the make-driven hardening)
      # shell out to a real toolchain — apx (governs the public API surface), buf
      # (codegen), and the public protoc plugins. Without these on PATH the tests
      # requireTools-SKIP, so until now those gates ran only on maintainer machines.
      # Install them (all public, no secrets) so CI enforces the scaffold contract.
      # apx/buf are pinned to the scaffold preflight floor; the protoc plugins track
      # @latest, matching what the generated `make tools` installs for real users.
      - name: Install apx + buf + protoc plugins
        run: |
          go install github.com/infobloxopen/apx/cmd/apx@v0.12.1
          go install github.com/bufbuild/buf/cmd/buf@v1.40.1
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Network-dependent (buf dep update hits the buf.build registry; go mod tidy /
      # go get hit the module proxy). Runs the scaffold suite explicitly rather than
      # relying on `make test` (which the unit job runs without these tools, so the
      # scaffold tests skip there — kept that way to keep the unit job hermetic).
      - name: Scaffold integration tests
        run: go test ./cmd/devedge-sdk -run TestScaffold -v
