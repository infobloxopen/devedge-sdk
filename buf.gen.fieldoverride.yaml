version: v2
# WS-033 TEMPORARY workspace-local override of the canonical apis field binding.
# Generates the infoblox.field.v1 Go binding from the local mirror (which is ahead
# of canonical: it declares credential=10 + credential_prefix=11) into
# hack/apisfield-override, a module whose path masquerades as the published apis
# field module so the workspace resolves fopts.GetCredential(). Remove once the
# canonical apis module ships these fields.
inputs:
  - directory: proto
    paths:
      - proto/infoblox/field/v1/field.proto
plugins:
  - local: protoc-gen-go
    out: hack/apisfield-override
    opt: module=github.com/infobloxopen/apis/proto/infoblox/field
